name: eSellify
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  # firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_database: ^12.2.0
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.1.3

  firebase_app_check: ^0.4.2
  flutter_local_notifications: ^21.0.0

  google_sign_in: ^7.2.0
  crypto: ^3.0.7
  sign_in_with_apple: ^7.0.1

  # Other dependencies
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  flutter_svg: ^2.2.4
  provider: ^6.1.5+1

  get: ^4.7.3

  cached_network_image: ^3.4.1
  country_code_picker: ^3.4.1

  geocoding: ^4.0.0
  http: ^1.4.0
  flutter_otp_text_field: ^1.5.1+1
  geolocator: ^14.0.2
  mailer: ^7.1.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.16.0
  flutter_google_places_hoc081098: ^2.0.0

  flutter_easyloading: ^3.0.5
  image_picker: ^1.2.1
  file_picker: ^10.1.7
  url_launcher: ^6.3.2
  googleapis_auth: ^2.0.0

  webview_flutter: ^4.13.1

  flutter_stripe: ^12.4.0
  razorpay_flutter: ^1.4.1
  google_mobile_ads: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: HelveticaNowText-Black
      fonts:
        - asset: assets/fonts/HelveticaNowText-Black.ttf

    - family: HelveticaNowText-BlackItalic
      fonts:
        - asset: assets/fonts/HelveticaNowText-BlackItalic.ttf

    - family: HelveticaNowText-Bold
      fonts:
        - asset: assets/fonts/HelveticaNowText-Bold.ttf

    - family: HelveticaNowText-BoldItalic
      fonts:
        - asset: assets/fonts/HelveticaNowText-BoldItalic.ttf

    - family: HelveticaNowText-ExtraBold
      fonts:
        - asset: assets/fonts/HelveticaNowText-ExtraBold.ttf

    - family: HelveticaNowText-ExtBdIta
      fonts:
        - asset: assets/fonts/HelveticaNowText-ExtBdIta.ttf

    - family: HelveticaNowText-ExtraLight
      fonts:
        - asset: assets/fonts/HelveticaNowText-ExtraLight.ttf

    - family: HelveticaNowText-ExtLtIta
      fonts:
        - asset: assets/fonts/HelveticaNowText-ExtLtIta.ttf

    - family: HelveticaNowText-Light
      fonts:
        - asset: assets/fonts/HelveticaNowText-Light.ttf

    - family: HelveticaNowText-LightItalic
      fonts:
        - asset: assets/fonts/HelveticaNowText-LightItalic.ttf

    - family: HelveticaNowText-Medium
      fonts:
        - asset: assets/fonts/HelveticaNowText-Medium.ttf

    - family: HelveticaNowText-MediumItalic
      fonts:
        - asset: assets/fonts/HelveticaNowText-MediumItalic.ttf

    - family: HelveticaNowText-Regular
      fonts:
        - asset: assets/fonts/HelveticaNowText-Regular.ttf

    - family: HelveticaNowText-RegIta
      fonts:
        - asset: assets/fonts/HelveticaNowText-RegIta.ttf

    - family: HelveticaNowText-Thin
      fonts:
        - asset: assets/fonts/HelveticaNowText-Thin.ttf

    - family: HelveticaNowText-ThinItalic
      fonts:
        - asset: assets/fonts/HelveticaNowText-ThinItalic.ttf