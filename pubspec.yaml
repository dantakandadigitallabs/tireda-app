name: eSellify
description: "A new Flutter project."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_database: ^12.4.6
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3

  firebase_app_check: ^0.4.5+2
  flutter_local_notifications: ^22.2.0
  flutter_native_splash: ^2.4.1

  google_sign_in: ^7.2.0
  crypto: ^3.0.7
  sign_in_with_apple: ^8.1.0

  # Other dependencies
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  provider: ^6.1.5+1
  hugeicons: ^0.0.7

  get: ^4.7.3

  cached_network_image: ^3.4.1
  country_code_picker: ^3.4.1

  # Tireda Custom: still on v4 — eSellify 1.5 bumped to v5.0.0 (major, breaking).
  # Do not bump until geocoding API changes are reviewed against our usage.
  geocoding: ^4.0.0
  http: ^1.6.0
  flutter_otp_text_field: ^1.5.1+1
  permission_handler: ^12.0.1
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  google_maps_flutter: ^2.18.0
  flutter_google_places_hoc081098: ^2.0.0

  flutter_easyloading: ^3.0.5
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  googleapis_auth: ^2.3.3

  webview_flutter: ^4.14.1
  syncfusion_flutter_pdfviewer: ^28.1.33

  google_mobile_ads: ^9.0.0
  cloud_functions: ^6.3.5

  # Tireda Custom: added for eSellify 1.5 share/deep-link feature
  # Pinned to 12.x on purpose: share_plus >=13.1 requires win32 ^6, but the
  # only stable file_picker (11.0.2) requires win32 ^5.9, and both compile
  # their win32 code on every target. 12.x uses win32 ^5.5 so the two align
  # with no override. (Revisit when a stable file_picker >=12 — which drops
  # win32 entirely — is released.)
  share_plus: ^12.0.0
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1

dependency_overrides:
  latlong2: ^0.10.1
  # Tireda Custom: geolocator_linux (via geolocator 14.0.3) wants
  # package_info_plus ^10 while google_api_headers wants ^8.
  # geolocator_linux is Linux-desktop only and never compiles on
  # Android/iOS. Pin to 8.x — it uses win32 ^5.5, keeping it aligned with
  # file_picker 11.0.2 / share_plus 12.x on the win32 5 line, and it's the
  # version google_api_headers (which DOES compile on mobile) needs.
  package_info_plus: ^8.3.1

# Native splash configuration
flutter_native_splash:
  # Tireda primary5 background — matches Flutter splash bg exactly
  color: "#0F6E56"

  # Logo PNG — place at assets/images/splash_logo.png
  # (export logo.svg as 300x300 PNG)
  image: assets/images/splash_logo.png

  # Fill the entire screen with the bg color (no white edges)
  fullscreen: true

  # Android 12+ uses the new SplashScreen API
  android_12:
    color: "#0F6E56"
    # Android 12 icon must be 1152x1152px with content in center 768x768px
    # Use the same PNG — the package handles sizing
    image: assets/images/splash_logo.png
    icon_background_color: "#0F6E56"

  # iOS
  ios: true

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: HelveticaNowText-Black
      fonts:
        - asset: assets/fonts/HelveticaNowText-Black.ttf

    - family: HelveticaNowText-BlackItalic
      fonts:
        - asset: assets/fonts/HelveticaNowText-BlackItalic.ttf

    - family: HelveticaNowText-Bold
      fonts:
        - asset: assets/fonts/HelveticaNowText-Bold.ttf

    - family: HelveticaNowText-BoldItalic
      fonts:
        - asset: assets/fonts/HelveticaNowText-BoldItalic.ttf

    - family: HelveticaNowText-ExtraBold
      fonts:
        - asset: assets/fonts/HelveticaNowText-ExtraBold.ttf

    - family: HelveticaNowText-ExtBdIta
      fonts:
        - asset: assets/fonts/HelveticaNowText-ExtBdIta.ttf

    - family: HelveticaNowText-ExtraLight
      fonts:
        - asset: assets/fonts/HelveticaNowText-ExtraLight.ttf

    - family: HelveticaNowText-ExtLtIta
      fonts:
        - asset: assets/fonts/HelveticaNowText-ExtLtIta.ttf

    - family: HelveticaNowText-Light
      fonts:
        - asset: assets/fonts/HelveticaNowText-Light.ttf

    - family: HelveticaNowText-LightItalic
      fonts:
        - asset: assets/fonts/HelveticaNowText-LightItalic.ttf

    - family: HelveticaNowText-Medium
      fonts:
        - asset: assets/fonts/HelveticaNowText-Medium.ttf

    - family: HelveticaNowText-MediumItalic
      fonts:
        - asset: assets/fonts/HelveticaNowText-MediumItalic.ttf

    - family: HelveticaNowText-Regular
      fonts:
        - asset: assets/fonts/HelveticaNowText-Regular.ttf

    - family: HelveticaNowText-RegIta
      fonts:
        - asset: assets/fonts/HelveticaNowText-RegIta.ttf

    - family: HelveticaNowText-Thin
      fonts:
        - asset: assets/fonts/HelveticaNowText-Thin.ttf

    - family: HelveticaNowText-ThinItalic
      fonts:
        - asset: assets/fonts/HelveticaNowText-ThinItalic.ttf