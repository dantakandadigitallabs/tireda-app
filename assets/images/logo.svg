<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent background — splash card provides the frosted tile -->
  <!-- Green rounded square tile using brand primary4 #1D9E75 -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="#1D9E75"/>

  <!-- T crossbar — rounded pill, dark teal fill matching primary5 -->
  <rect x="34" y="56" width="132" height="28" rx="14" fill="#085041"/>

  <!-- T stem — centered, same dark teal -->
  <rect x="86" y="70" width="28" height="90" rx="14" fill="#085041"/>

  <!-- Signature dot — outer ghost ring -->
  <circle cx="152" cy="152" r="13" fill="#085041" opacity="0.30"/>
  <!-- Signature dot — solid inner -->
  <circle cx="152" cy="152" r="8" fill="#085041"/>
</svg>
